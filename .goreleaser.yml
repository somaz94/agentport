version: 2

# Names the release archives. Set it explicitly: it defaults to the repository
# name, which is not always the binary name, and scripts/install.sh builds its
# download URL from this rather than from the binary.
project_name: agentport

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/agentport
    binary: agentport
    env:
      - CGO_ENABLED=0
    # No Windows build yet: sync compares file modes, which Windows does not
    # keep, so every tracked file would read as edited.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # GoReleaser's Version drops the tag's v; go install and make keep it.
      - -X github.com/somaz94/agentport/cmd/cli.Version=v{{.Version}}
      - -X github.com/somaz94/agentport/cmd/cli.GitCommit={{.Commit}}
      - -X github.com/somaz94/agentport/cmd/cli.BuildDate={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  groups:
    - title: "Features"
      regexp: '^feat'
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix'
      order: 1
    - title: "Performance"
      regexp: '^perf'
      order: 2
    - title: "Refactoring"
      regexp: '^refactor'
      order: 3
    - title: "Build"
      regexp: '^build'
      order: 4
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - '^docs: update changelog'
      - '^docs: update CONTRIBUTORS'
      - '^Merge'
      - '^Auto commit'

release:
  github:
    owner: somaz94
    name: agentport
  draft: false
  prerelease: auto

# Homebrew. A cask, not a formula: GoReleaser deprecated "brews" in v2.10 and
# documents removal in v2.16, and releases here pin no GoReleaser version.
# Casks work on Linux as well; one whose only artifact is a binary installs
# there the same way.
homebrew_casks:
  - name: agentport
    binaries:
      - agentport
    directory: Casks
    repository:
      owner: somaz94
      name: homebrew-tap
    homepage: "https://github.com/somaz94/agentport"
    description: "Convert Claude Code skills, commands and subagents to Codex and Antigravity formats"
    hooks:
      post:
        # Homebrew quarantines cask downloads. Unless the binary is signed and
        # notarized, macOS refuses to run it without this.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agentport"]
          end
    caveats: |
      agentport installed!

      Quick start:
        agentport scan          # What each harness has installed, and how portable it is
        agentport sync          # Preview converting ~/.claude into every target
        agentport --help        # Full usage

      Docs: https://github.com/somaz94/agentport
